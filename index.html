<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電子繪本 - 數位故事書</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #1e272e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            max-width: 950px;
            width: 100%;
            padding: 20px;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 1.8rem;
            color: #f1c40f;
        }
        .book-stage {
            position: relative;
            background: #000;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
            overflow: hidden;
            aspect-ratio: 16 / 11;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 3px solid #34495e;
        }
        .book-stage img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-bottom: 15px;
        }
        button {
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
        }
        button:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }
        button img {
            width: 65px;
            height: auto;
        }
        .page-indicator {
            font-size: 1.25rem;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 20px;
            border-radius: 25px;
            letter-spacing: 1px;
        }
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .btn-custom {
            background-color: #e74c3c;
            color: white;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }
        .btn-custom:hover {
            background-color: #c0392b;
        }
        .btn-audio {
            background-color: #27ae60;
        }
        .btn-audio:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>電子繪本導覽</h1>
        
        <div class="book-stage">
            <!-- 預設顯示封面 0.jpg -->
            <img id="book-image" src="assets/graphics/0.jpg" alt="繪本頁面">
        </div>

        <div class="controls">
            <button id="prev-btn" onclick="prevPage()" title="上一頁">
                <img src="assets/graphics/left.jpg" alt="上一頁">
            </button>
            
            <div class="page-indicator" id="indicator">封面 (0 / 19)</div>
            
            <button id="next-btn" onclick="nextPage()" title="下一頁">
                <img src="assets/graphics/right.jpg" alt="下一頁">
            </button>
        </div>

        <div class="action-bar">
            <button class="btn-custom" onclick="goToCover()">回到封面</button>
            <button class="btn-custom btn-audio" id="audio-btn" onclick="toggleSpeech()">播放語音旁白</button>
        </div>
    </div>

    <!-- 背景音樂與語音播放元素 -->
    <!-- 假設音樂放在 assets/music/bgm.mp3，語音對應 0.mp3 ~ 19.mp3 放在 assets/speech/ -->
    <audio id="speech-audio" onerror="handleAudioError()"></audio>

    <script>
        const totalPages = 19; // 0.jpg 到 19.jpg
        let currentPage = 0;
        let isAudioPlaying = false;

        const bookImage = document.getElementById('book-image');
        const indicator = document.getElementById('indicator');
        const speechAudio = document.getElementById('speech-audio');
        const audioBtn = document.getElementById('audio-btn');

        function updateBook() {
            // 切換圖片
            bookImage.src = `assets/graphics/${currentPage}.jpg`;
            
            // 更新頁碼標示
            if (currentPage === 0) {
                indicator.innerText = `封面 (0 / ${totalPages})`;
            } else {
                indicator.innerText = `第 ${currentPage} 頁 / 共 ${totalPages} 頁`;
            }

            // 切換頁面時自動嘗試播放對應的語音 (若該頁有語音檔)
            playCurrentSpeech();
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                updateBook();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                updateBook();
            }
        }

        function goToCover() {
            currentPage = 0;
            updateBook();
        }

        function playCurrentSpeech() {
            // 對應 speech 資料夾內的音檔命名，例如 0.mp3, 1.mp3 ... (若您的副檔名不同可在此調整)
            speechAudio.src = `assets/speech/${currentPage}.mp3`;
            speechAudio.play().then(() => {
                isAudioPlaying = true;
                audioBtn.innerText = "暫停語音旁白";
            }).catch(() => {
                // 如果找不到音檔或瀏覽器阻擋自動播放則保持靜默
                isAudioPlaying = false;
                audioBtn.innerText = "播放語音旁白";
            });
        }

        function toggleSpeech() {
            if (isAudioPlaying) {
                speechAudio.pause();
                isAudioPlaying = false;
                audioBtn.innerText = "播放語音旁白";
            } else {
                speechAudio.play().then(() => {
                    isAudioPlaying = true;
                    audioBtn.innerText = "暫停語音旁白";
                }).catch(() => {
                    alert("目前頁面找不到對應的語音檔案 (assets/speech/" + currentPage + ".mp3)");
                });
            }
        }

        function handleAudioError() {
            isAudioPlaying = false;
            audioBtn.innerText = "播放語音旁白";
        }

        // 支援鍵盤左右鍵快速翻頁
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                nextPage();
            } else if (e.key === 'ArrowLeft') {
                prevPage();
            }
        });
    </script>

</body>
</html>
